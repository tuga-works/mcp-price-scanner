[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-price-scanner"
version = "0.1.0"
description = "Self-hosted, read-only MCP bridge that fetches public marketplace listings with a real browser from a residential connection."
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
dependencies = [
    "fastmcp>=4.1,<5",
    "playwright>=1.50",
    "curl_cffi>=0.10",
    "selectolax>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
price-scanner = "price_scanner.server:main"

[tool.setuptools.packages.find]
include = ["price_scanner*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
